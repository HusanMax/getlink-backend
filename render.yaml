services:
  - type: web
    name: getlink-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run prisma:deploy && npm run start:prod
    healthCheckPath: /api
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
